<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Search">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Anne's Job Search</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-card" autocomplete="off">
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>Job Search</h1>
    <p class="muted">This dashboard is encrypted. Enter your password to open it.</p>
    <label class="sr" for="pw">Password</label>
    <div class="pw-wrap">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <button type="button" id="pwToggle" class="pw-eye" aria-label="Show password" aria-pressed="false" aria-controls="pw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    </div>
    <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button type="submit" class="btn primary" id="unlockBtn">Unlock</button>
    <p id="lockMsg" class="lock-msg" role="alert"></p>
  </form>
</div>

<header class="topbar">
  <h1 id="title">Job Search</h1>
  <span id="updated" class="muted small"></span>
</header>

<main id="main" tabindex="-1">
  <p class="muted center pad">Loading…</p>
</main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Do next</span></a>
  <a href="#todos" data-tab="todos"><svg viewBox="0 0 24 24"><path d="M4 6.5l1.8 1.8L9 5M4 12.5l1.8 1.8L9 11M4 18.5l1.8 1.8L9 17M12 7h8M12 13h8M12 19h8"/></svg><span>My To-Dos</span></a>
  <a href="#approvals" data-tab="approvals"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4zM8.5 10.5l2.2 2.2 4.8-4.8"/></svg><span>Approvals</span><span class="badge" hidden></span></a>
  <a href="#opps" data-tab="opps"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Jobs</span></a>
  <a href="#tracker" data-tab="tracker"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg><span>Tracker</span></a>
  <a href="#docs" data-tab="docs"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg><span>Docs</span></a>
</nav>
<script src="app.js"></script>
</body>
</html>
